name: ci-cd to cloudrun

permissions:
id-token: write
contents: read

on:
push:
branches: ["cloudrun"]
pull_request:
branches: ["cloudrun"]

env:
REPO: ${{ secrets.GKE_ARTIFACT_REPOSITORY }}
IMAGE: backstage

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set Up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 24
      cache: yarn

  - name: Install Dependencies
    run: yarn install
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

  - name: Compile TypeScript
    run: yarn tsc

  - name: Run Unit Tests
    run: yarn test:all

  - name: Build the application
    run: yarn build:all

  - name: Upload backend build
    uses: actions/upload-artifact@v4
    with:
      name: backend-dist
      path: packages/backend/dist
```

image-build:
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Download backend build
    uses: actions/download-artifact@v4
    with:
      name: backend-dist
      path: packages/backend/dist

  - name: Authenticate to Google Cloud
    uses: google-github-actions/auth@v2
    with:
      workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  - name: Set up gcloud CLI
    uses: google-github-actions/setup-gcloud@v2

  - name: Configure Docker for Artifact Registry
    run: |
      gcloud auth configure-docker "${{ secrets.GKE_REGION }}-docker.pkg.dev" --quiet

  - name: Debug REPO variable
    run: |
      if [ -z "$REPO" ]; then
        echo "ERROR: REPO is empty"
        exit 1
      fi
      echo "REPO is configured"

  - name: Build Docker image
    run: |
      docker build \
        -t "${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}" \
        -f packages/backend/Dockerfile .

  - name: Push image to Artifact Registry
    run: |
      docker push "${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}"
```

deploy:
runs-on: ubuntu-latest
needs: image-build

```
steps:
  - name: Authenticate to Google Cloud
    uses: google-github-actions/auth@v2
    with:
      workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  - name: Set gcloud project
    run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

  - name: Deploy to Cloud Run
    run: |
      gcloud run deploy backstage \
        --image "${{ secrets.GKE_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GKE_ARTIFACT_REPOSITORY }}/backstage:${{ github.sha }}" \
        --region "${{ secrets.GKE_REGION }}" \
        --platform managed \
        --allow-unauthenticated \
        --project "${{ secrets.GCP_PROJECT_ID }}" \
        --memory 1Gi \
        --set-env-vars NODE_ENV=production
```
